<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Asteroid War</title><style>
*{box-sizing:border-box}body{margin:0;background:#080e19;color:#e8f5ff;font:16px system-ui;text-align:center}main{max-width:900px;margin:auto;padding:12px}h1{color:#5affaa;letter-spacing:.12em}button,input{font:inherit;border-radius:10px;padding:10px;margin:4px;border:1px solid #456;background:#14243b;color:white}input{display:block;width:min(100%,320px);margin:10px auto;font-size:16px}button{cursor:pointer;touch-action:manipulation}button.primary{background:#5affaa;color:#06160d;font-weight:bold}button:disabled{opacity:.5}[hidden]{display:none!important}ol{text-align:left;max-width:400px;margin:auto}#msg{min-height:1.5em}.screen{padding:12px}.toolbar{display:flex;justify-content:center;flex-wrap:wrap}.toolbar button{font-size:13px;padding:7px 10px}.arena{position:relative;height:65vh;height:65dvh;min-height:180px;background:#03060e;border:1px solid #345;border-radius:12px;overflow:hidden}canvas{display:block;width:100%;height:100%;object-fit:contain;touch-action:none}.controls{position:absolute;left:8px;right:8px;bottom:6px;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none;user-select:none;-webkit-user-select:none}.pad,#fire{pointer-events:auto;touch-action:none}.pad{width:84px;height:84px;border-radius:50%;background:#17283ecc;position:relative;border:1px solid #456}.knob{position:absolute;width:32px;height:32px;left:50%;top:50%;margin:-16px;border-radius:50%;background:#5affaa;pointer-events:none}#fire{width:70px;height:54px;background:#773b26;margin:0;font-size:12px}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#03060ebd;z-index:2;padding:8px}.overlay h2{margin:4px}.overlay p{margin:5px}.overlay button{padding:8px 12px}.expanded{position:fixed;inset:0;z-index:100}#game.expanded,#game:fullscreen{background:#080e19;display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%;padding:6px 8px;padding: max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));overflow:hidden}#game.expanded .arena,#game:fullscreen .arena{flex:1;min-height:0;height:auto}#gameStatus{font-size:12px}#hud{font-size:14px;padding:3px} @media(orientation:landscape) and (max-height:600px){.arena{height:65vh;height:65dvh}.pad{width:72px;height:72px}#fire{width:64px;height:48px}.toolbar button{padding:4px 8px;margin:2px}.overlay button{font-size:13px;padding:6px 10px}#gameStatus{max-height:18px;overflow:hidden}}
</style><main><h1 id="heading">ASTEROID WAR</h1>
<section id="auth" class="screen"><h2>Entrar</h2><form id="loginForm"><input id="user" placeholder="Usuário" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="30" required><input id="pass" type="password" placeholder="Senha" autocomplete="current-password" required><button class="primary" id="login" type="submit">Entrar</button></form><button id="openRegister">Criar conta</button></section>
<section id="registerScreen" class="screen" hidden><h2>Criar conta</h2><form id="registerForm"><input id="newUser" placeholder="Usuário" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" required><input id="newPass" type="password" placeholder="Senha (8+ caracteres)" autocomplete="new-password" minlength="8" maxlength="100" required><p>Usuário: 3 a 30 letras sem acentos, números ou _.</p><button class="primary" id="register" type="submit">Cadastrar</button></form><button id="backLogin">Voltar</button></section>
<section id="menu" class="screen" hidden><h2>Menu principal</h2><p id="profile"></p><button class="primary" id="play">Jogar</button><button id="logout">Sair da conta</button><button id="deleteAccount">Excluir minha conta</button><h2>Ranking</h2><ol id="menuRanking"></ol></section>
<section id="rankScreen" class="screen" hidden><h2>Ranking</h2><ol id="ranking"></ol><button id="rankBack">Voltar</button></section>
<section id="game" hidden><div class="toolbar"><button id="pause">Pausar</button><button id="gameMenu">Menu</button><button id="fullscreen">Tela cheia</button></div><div id="hud">Pontos: 0 | Vidas: 5</div><div class="arena"><canvas id="canvas" width="1000" height="700"></canvas><div class="controls"><div class="pad" id="pad" aria-label="Joystick"><div class="knob" id="knob"></div></div><button id="fire">ATIRAR</button></div><div class="overlay" id="ready"><h2>Asteroid War</h2><button class="primary" id="start">Começar</button></div><div class="overlay" id="over" hidden><h2>SE FODEU</h2><p id="finalScore"></p><button class="primary" id="continueGame">Continuar partida</button><button id="overRank">Ver ranking</button><button id="overMenu">Voltar ao menu</button></div></div><div id="gameStatus" role="status"></div></section><p id="msg" role="status"></p></main><script>
const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d');let token='',player=null,running=false,paused=false,score=0,lives=5,x=100,y=300,shots=[],enemies=[],spawn=0,lastShot=0,keys=new Set(),dx=0,dy=0,firing=false,previous=0,session=0;
const stars=Array.from({length:100},()=>[Math.random()*1000,Math.random()*700]);
async function api(path,data,authToken=token){let r;try{r=await fetch(path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json',...(authToken?{Authorization:'Bearer '+authToken}:{})},...(data?{body:JSON.stringify(data)}:{})})}catch(e){throw Error('Sem conexão com o servidor. Tente novamente.')}let j;try{j=await r.json()}catch(e){throw Error('Servidor iniciando ou indisponível. Tente novamente em instantes.')}if(!r.ok)throw Error(typeof j.detail==='string'?j.detail:'Confira o usuário e a senha.');return j}
function msg(t){$('msg').textContent=t;$('gameStatus').textContent=t}
function show(id){for(const s of ['auth','registerScreen','menu','rankScreen','game'])$(s).hidden=s!==id;$('heading').hidden=id==='game';msg('');if(id==='menu')rank()}
async function rank(){try{let list=await api('/ranking');for(const id of ['ranking','menuRanking']){$(id).textContent='';for(const p of list){let li=document.createElement('li');li.textContent=p.username+' — '+p.record;$(id).appendChild(li)}}}catch(e){msg('Ranking indisponível: '+e.message)}}
function profile(){if(player)$('profile').textContent=player.username+(player.username==='Riquelme'?' (2x pontos)':'')+' | Recorde: '+player.record}
function store(t){try{if(t)localStorage.setItem('aw_session',t);else localStorage.removeItem('aw_session')}catch(e){}}
function deviceId(){let id=localStorage.getItem('aw_device');if(!id){id=Array.from(crypto.getRandomValues(new Uint8Array(24)),v=>v.toString(16).padStart(2,'0')).join('');localStorage.setItem('aw_device',id)}return id}
$('deleteAccount').onclick=async()=>{if(!confirm('Excluir sua conta e recorde permanentemente?'))return;let password=prompt('Confirme sua senha:');if(!password)return;try{await api('/delete-account',{password});$('logout').click();msg('Conta excluída.')}catch(e){msg(e.message)}};
async function enter(mode){let reg=mode==='register',btn=$(reg?'register':'login');btn.disabled=true;msg('Conectando...');try{let j=await api('/'+mode,{username:$(reg?'newUser':'user').value.trim(),password:$(reg?'newPass':'pass').value,...(reg?{device_id:deviceId()}:{})});token=j.token;player=j.player;session++;store(token);$('pass').value='';$('newPass').value='';profile();show('menu')}catch(e){msg(e.message)}finally{btn.disabled=false}}
$('loginForm').onsubmit=e=>{e.preventDefault();enter('login')};$('registerForm').onsubmit=e=>{e.preventDefault();enter('register')};$('openRegister').onclick=()=>show('registerScreen');$('backLogin').onclick=()=>show('auth');
async function save(){if(!token)return;let t=token,s=session;try{let j=await api('/score',{score},t);if(s===session&&player){player.record=Math.max(player.record,j.record);profile()}}catch(e){msg('Não foi possível salvar o recorde: '+e.message)}}
$('logout').onclick=()=>{session++;token='';player=null;store('');show('auth')};
function reset(){powers=new Set();orbs=[];boss=null;hazards=[];nextPower=250;nextBoss=2000;score=0;lives=5;x=100;y=300;shots=[];enemies=[];spawn=0;lastShot=0;paused=false;running=false;clear();$('pause').textContent='Pausar';$('over').hidden=true;$('ready').hidden=false}
$('play').onclick=()=>{reset();show('game')};
$('start').onclick=()=>{$('start').blur();$('ready').hidden=true;running=true;paused=false;msg('')};
$('continueGame').onclick=()=>{lives=5;enemies=[];shots=[];hazards=[];spawn=0;lastShot=0;clear();$('over').hidden=true;running=true;paused=false;msg('')};
let rankFrom='menu';
async function goMenu(){running=false;clear();await closeFull();await save();show('menu');profile()}
$('gameMenu').onclick=goMenu;$('overMenu').onclick=goMenu;
async function openRank(from){rankFrom=from;await closeFull();show('rankScreen');await rank()}
$('overRank').onclick=()=>openRank('game');$('rankBack').onclick=()=>show(rankFrom);
const game=$('game');
function syncFull(){$('fullscreen').textContent=(document.fullscreenElement===game||game.classList.contains('expanded'))?'Sair da tela cheia':'Tela cheia'}
async function closeFull(){game.classList.remove('expanded');if(document.fullscreenElement===game){try{await document.exitFullscreen()}catch(e){}}try{screen.orientation?.unlock?.()}catch(e){}syncFull()}
$('fullscreen').onclick=async()=>{if(document.fullscreenElement===game||game.classList.contains('expanded')){await closeFull();return}try{if(!game.requestFullscreen)throw Error('unsupported');await game.requestFullscreen();try{await screen.orientation?.lock?.('landscape')}catch(e){}}catch(e){game.classList.add('expanded')}syncFull();if(matchMedia('(orientation:portrait)').matches)msg('Vire o celular de lado para jogar em modo paisagem.')};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){try{screen.orientation?.unlock?.()}catch(e){}}syncFull()});
function toggle(){if(running){paused=!paused;$('pause').textContent=paused?'Continuar':'Pausar'}}$('pause').onclick=toggle;
addEventListener('keydown',e=>{if($('game').hidden||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys.add(k);if(k==='escape'&&!e.repeat)toggle()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
function clear(){pointer=null;keys.clear();dx=dy=0;firing=false;$('knob').style.transform='none'}addEventListener('blur',()=>{clear();if(running&&!paused)toggle()});
let pointer=null;function move(e){let r=$('pad').getBoundingClientRect(),a=e.clientX-r.left-r.width/2,b=e.clientY-r.top-r.height/2,n=Math.max(r.width*.32,Math.hypot(a,b));dx=a/n;dy=b/n;$('knob').style.transform='translate('+dx*r.width*.28+'px,'+dy*r.width*.28+'px)'}
$('pad').onpointerdown=e=>{if(pointer!==null)return;pointer=e.pointerId;try{$('pad').setPointerCapture(pointer)}catch(e){}move(e)};$('pad').onpointermove=e=>{if(e.pointerId===pointer)move(e)};for(let ev of ['pointerup','pointercancel','lostpointercapture'])$('pad').addEventListener(ev,e=>{if(e.pointerId===pointer){pointer=null;dx=dy=0;$('knob').style.transform='none'}});
$('fire').onpointerdown=e=>{try{$('fire').setPointerCapture(e.pointerId)}catch(e){}firing=true};for(let ev of ['pointerup','pointercancel','lostpointercapture'])$('fire').addEventListener(ev,()=>firing=false);
let powers=new Set(),orbs=[],boss=null,hazards=[],nextPower=250,nextBoss=2000;
const colors=['#ff4545','#42aaff','#ffe24c'];
function milestones(){while(score>=nextPower){orbs.push({x:80+Math.random()*840,y:30,type:Math.floor(Math.random()*3)});nextPower+=250}if(!boss&&score>=nextBoss){boss={x:420,y:45,hp:24,max:24,t:0,age:0,pattern:0};nextBoss+=2000}}
function extras(dt){milestones();for(const o of orbs)o.y+=85*dt;orbs=orbs.filter(o=>{if(Math.hypot(o.x-x-25,o.y-y-25)<38){powers.add(o.type);return false}return o.y<720});if(boss){boss.age+=dt;boss.x=420+Math.sin(boss.age*.9)*330;boss.t+=dt;if(boss.t>=1.8){boss.t=0;let bx=boss.x+80,by=boss.y+65;let angle=Math.atan2(y+25-by,x+25-bx);let angles=boss.pattern++%2?[Math.PI/2-.32,Math.PI/2,Math.PI/2+.32]:[angle];for(const a of angles)hazards.push({x:bx,y:by,vx:Math.cos(a)*180,vy:Math.sin(a)*180})}for(let i=shots.length-1;i>=0;i--){let s=shots[i];if(s.x>boss.x-10&&s.x<boss.x+170&&s.y>boss.y-10&&s.y<boss.y+75){shots.splice(i,1);boss.hp--;if(boss.hp<=0){boss=null;hazards=[];score+=100;break}}}}for(const h of hazards){h.x+=h.vx*dt;h.y+=h.vy*dt}hazards=hazards.filter(h=>{if(Math.hypot(h.x-x-25,h.y-y-25)<29){lives--;return false}return h.x>-30&&h.x<1030&&h.y>-30&&h.y<730})}
function overlap(a,b,w,h){return a.x<b.x+40&&a.x+w>b.x&&a.y<b.y+40&&a.y+h>b.y}
function loop(now){let dt=Math.min((now-previous)/1000,.05);previous=now;if(running&&!paused){let mx=dx+(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),my=dy+(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0),n=Math.max(1,Math.hypot(mx,my));x=Math.max(0,Math.min(950,x+mx/n*720*dt));y=Math.max(0,Math.min(650,y+my/n*720*dt));if((firing||keys.has(' '))&&now-lastShot>=250){for(const offset of (powers.has(0)?[13,37]:[25]))shots.push({x:x+offset,y,r:powers.has(2)?10:6,v:powers.has(1)?850:540});lastShot=now}spawn+=dt;if(spawn>=(boss?2.5:1)){spawn=0;enemies.push({x:Math.random()*960,y:-50})}for(let s of shots)s.y-=s.v*dt;shots=shots.filter(s=>s.y>=0);for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];e.y+=120*dt;if(overlap({x,y},e,50,50)||e.y>700){enemies.splice(i,1);lives--;continue}let j=shots.findIndex(s=>overlap({x:s.x-s.r,y:s.y-s.r},e,s.r*2,s.r*2));if(j>=0){shots.splice(j,1);enemies.splice(i,1);score+=(player?.username==='Riquelme'?20:10)}}extras(dt);if(lives<=0){lives=0;running=false;clear();$('finalScore').textContent='Pontuação: '+score;$('over').hidden=false;save()}}
let scene=Math.floor(score/1000)%3;ctx.fillStyle=['#03060e','#102b49','#40120b'][scene];ctx.fillRect(0,0,1000,700);ctx.fillStyle=['white','#d9f6ff','#ff9750'][scene];for(let s of stars){if(running&&!paused)s[1]=(s[1]+120*dt)%700;ctx.fillRect(s[0],s[1],scene===1?5:3,scene===2?7:3)}ctx.fillStyle='#5affaa';ctx.beginPath();ctx.moveTo(x+25,y);ctx.lineTo(x,y+50);ctx.lineTo(x+50,y+50);ctx.fill();ctx.fillStyle='#ff5353';for(let e of enemies)ctx.fillRect(e.x,e.y,40,40);ctx.fillStyle='#ffe24c';for(let s of shots){ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}for(const o of orbs){ctx.fillStyle=colors[o.type];ctx.beginPath();ctx.arc(o.x,o.y,16,0,Math.PI*2);ctx.fill()}if(boss){ctx.fillStyle='#a86bff';ctx.fillRect(boss.x,boss.y,160,65);ctx.fillStyle='#ff4545';ctx.fillRect(boss.x,boss.y-12,160,6);ctx.fillStyle='#5affaa';ctx.fillRect(boss.x,boss.y-12,160*boss.hp/boss.max,6)}ctx.fillStyle='#ff9c42';for(const h of hazards){ctx.beginPath();ctx.arc(h.x,h.y,9,0,Math.PI*2);ctx.fill()}$('hud').textContent='Pontos: '+score+' | Vidas: '+lives+' | '+['Espaço','Neve no Espaço','Inferno no Espaço'][scene]+(boss?' | BOSS':'')+(powers.size?' | Poderes: '+[...powers].map(p=>['🔴','🔵','🟡'][p]).join(''):'');requestAnimationFrame(loop)}requestAnimationFrame(loop);(async()=>{try{let t=localStorage.getItem('aw_session');if(t){token=t;player=await api('/me');profile();show('menu')}}catch(e){token='';player=null;store('')}})();
</script></html>
